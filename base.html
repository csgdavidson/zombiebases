<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Base Details</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1><a class="home-link" href="./index.html">Zombie Bases</a></h1>
    </div>
  </header>

  <main>
    <a id="back-link" class="back-link" href="./index.html">← Back to List</a>

    <p id="detail-status" role="status" aria-live="polite"></p>

    <article id="base-detail" class="base-page" hidden>
      <header>
        <h2 id="base-name"></h2>
        <p id="base-meta" class="base-meta"></p>
        <ul id="base-meta-row" class="base-meta-row" aria-label="Base metadata"></ul>
      </header>

      <section id="hero-section" class="content-section" aria-label="Hero image section" hidden>
        <h3>Hero Image</h3>
        <img id="base-hero-image" class="hero-image" alt="">
      </section>

      <section id="summary-section" class="content-section" aria-label="Summary section" hidden>
        <h3>Summary</h3>
        <p id="base-summary"></p>
      </section>

      <section id="description-section" class="content-section" aria-label="Description section">
        <h3>Description</h3>
        <p id="base-description"></p>
      </section>

      <section id="score-section" class="content-section" aria-label="Score section" hidden>
        <h3>Score</h3>
        <p id="base-score"></p>
      </section>

      <section id="related-section" class="content-section" aria-label="Related bases section" hidden>
        <h3>Related Bases</h3>
        <ul id="related-bases-list" class="compact-base-list"></ul>
      </section>
    </article>

    <section id="not-found" class="not-found" hidden>
      <h2>Base not found</h2>
      <p>We couldn't find a base for this link.</p>
      <a href="./index.html">Back to homepage</a>
    </section>
  </main>

  <script src="./js/base.js" defer></script>
</body>
</html>
