<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Bases | Survival Base Directory</title>
  <meta name="description" content="Explore zombie survival base locations by region and type, with list and map views for quick comparison.">
  <link rel="canonical" href="https://zombiebases.com/">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Zombie Bases</h1>
    </div>
  </header>

  <main>
    <section id="featured-section" class="featured-section" aria-label="Featured zombie bases" hidden>
      <h2>Featured Bases</h2>
      <ul id="featured-bases-list" class="compact-base-list" aria-label="Featured zombie bases list"></ul>
    </section>

    <section class="rankings-explore" aria-label="Explore by rankings">
      <h2>Explore by rankings</h2>
      <ul class="rankings-explore-links">
        <li><a href="./rankings.html">Best overall</a></li>
        <li><a href="./rankings-region.html">Best by region</a></li>
        <li><a href="./rankings-type.html">Best by type</a></li>
      </ul>
      <h3 class="rankings-explore-subheading">Explore by scenario</h3>
      <ul class="rankings-explore-links">
        <li><a href="./scenarios.html?scenario=long_term_survival">Long-term survival</a></li>
        <li><a href="./scenarios.html?scenario=short_term_refuge">Short-term refuge</a></li>
        <li><a href="./scenarios.html?scenario=community_bases">Community bases</a></li>
        <li><a href="./scenarios.html?scenario=high_risk_high_reward">High risk / high reward</a></li>
        <li><a href="./scenarios.html?scenario=worst_bases">Worst bases</a></li>
      </ul>
    </section>

    <section class="view-toggle" aria-label="Select homepage view">
      <span class="toggle-label">View</span>
      <div class="toggle-buttons" role="group" aria-label="Homepage views">
        <a id="view-list" class="toggle-button" href="./index.html" data-view="list" aria-pressed="true">List</a>
        <a id="view-map" class="toggle-button" href="./index.html?view=map" data-view="map" aria-pressed="false">Map</a>
      </div>
    </section>

    <section class="search" aria-label="Search zombie bases">
      <label for="search-input">
        Search
        <input id="search-input" type="search" placeholder="Search by name, region, country, or type">
      </label>
    </section>

    <section class="filters" aria-label="Filter zombie bases">
      <label for="region-filter">
        Region
        <select id="region-filter">
          <option value="">All regions</option>
        </select>
      </label>

      <label for="type-filter">
        Type
        <select id="type-filter">
          <option value="">All types</option>
        </select>
      </label>

      <label for="sort-select">
        Sort by
        <select id="sort-select"></select>
      </label>

      <button id="reset-filters" type="button" class="reset-filters">Reset filters</button>
    </section>

    <p id="result-count" class="result-count" aria-live="polite"></p>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="list-view" aria-label="List view">
      <ul id="bases-list" aria-label="List of zombie base locations"></ul>
    </section>

    <section id="map-view" class="map-view" aria-label="Map view" hidden>
      <div id="bases-map" class="bases-map" role="application" aria-label="Zombie base map"></div>
      <p id="map-status" class="map-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin="" defer></script>
  <script src="./js/map.js" defer></script>
  <script src="./js/slug.js" defer></script>
  <script src="./js/seo.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
