name: Update sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'data/bases-index.json'
      - 'bases/**/*.html'
      - 'index.html'
      - 'scripts/generate-sitemap.py'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: python3 scripts/generate-sitemap.py

      - name: Commit updated sitemap
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap updates needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: regenerate sitemap"
          git push
